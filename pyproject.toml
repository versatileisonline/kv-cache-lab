[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-lab"
version = "0.1.0"
description = "Controlled experiments on LLM KV-cache memory, speed, and answer quality"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
inference = [
    "torch==2.4.1",
    "transformers==4.44.2",
    "accelerate==0.34.2",
    "huggingface-hub==0.24.7",
    "safetensors==0.4.5",
    "numpy==1.26.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
